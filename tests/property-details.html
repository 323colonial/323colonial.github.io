<!doctype html>
<meta charset="utf-8">
<title>Property details regression</title>
<h1>Property details regression</h1>
<pre id="results">Running…</pre>
<iframe title="Property details under test" style="width:1440px;height:1000px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const results = [];
const check = (ok, name) => results.push(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
try {
  await new Promise(resolve => { frame.onload = resolve; frame.src = '../index.html'; });
  const doc = frame.contentDocument;
  const link = doc.querySelector('.price a');
  check(link?.textContent === 'Property details', 'Property details text is the native link in facts heading');
  if (!link) throw new Error('Missing Property details link');
  check((link.getAttribute('aria-label') || link.textContent) === 'Property details', 'accessible name matches visible link text');
  const price = [...doc.querySelectorAll('.price span')].find(span => span.textContent === '$499,000');
  check(Boolean(price) && !price.closest('a') && price.tabIndex === -1, 'price is plain non-focusable text');
  const dialog = doc.querySelector('#property-details');
  check(link.getAttribute('aria-haspopup') === 'dialog', 'enhanced link announces dialog');
  check(dialog?.getAttribute('aria-labelledby') === 'property-details-title', 'dialog has accessible title');
  for (const [width, height] of [[1440, 1000], [820, 900], [390, 844], [320, 568], [800, 400]]) {
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    await settle();
    check(doc.querySelector('#details').getBoundingClientRect().height === 0,
      `${width}px: enhanced closing details take no space`);
    link.scrollIntoView();
    const url = frame.contentWindow.location.href;
    price?.click();
    await settle();
    check(!dialog.open && frame.contentWindow.location.href === url, `${width}px: price click does not open or navigate`);
    check(link.getBoundingClientRect().height >= 24, `${width}px: details link retains touch target`);
    link.focus();
    link.click();
    check(dialog.open, `${width}px: Property details opens dialog`);
    check(dialog.querySelector('dl').textContent === doc.querySelector('#details dl').textContent,
      `${width}px: all twelve property facts preserved without copy drift`);
    check(dialog.querySelectorAll('dt').length === 12, `${width}px: twelve facts`);
    check(dialog.contains(doc.activeElement), `${width}px: focus enters dialog`);
    check(dialog.scrollWidth <= dialog.clientWidth && doc.documentElement.scrollWidth <= width,
      `${width}px: no horizontal overflow`);
    const rect = dialog.getBoundingClientRect();
    check(rect.top >= 0 && rect.bottom <= height, `${width}px: dialog fits viewport`);
    dialog.querySelector('button').click();
    await settle();
    check(!dialog.open && doc.activeElement === link, `${width}px: close restores Property details focus`);
  }
  const modified = new frame.contentWindow.MouseEvent('click', {bubbles: true, cancelable: true, ctrlKey: true});
  link.dispatchEvent(modified);
  check(!modified.defaultPrevented && !dialog.open, 'modified click keeps native link behavior');
  frame.contentWindow.location.hash = 'details';
  await settle();
  check(doc.querySelector('#details').getBoundingClientRect().height > 0, 'direct details fragment exposes inline fallback');
  check(!dialog.open, 'direct fragment does not force a modal');
  frame.contentWindow.location.hash = '';
  await settle();
  check(doc.querySelector('#details').getBoundingClientRect().height === 0, 'leaving details fragment hides duplicate again');
  const source = await fetch('../index.html').then(r => r.text());
  frame.setAttribute('sandbox', 'allow-same-origin');
  await new Promise(resolve => {
    frame.onload = resolve;
    frame.srcdoc = source.replace('<head>', `<head><base href="${new URL('../', location.href)}">`);
  });
  const fallback = frame.contentDocument;
  const anchor = fallback.querySelector('.price a');
  check(anchor.textContent === 'Property details' && anchor.getAttribute('href') === '#details' && !anchor.hasAttribute('aria-haspopup'), 'no-JS Property details remains ordinary details link');
  check(![...fallback.querySelectorAll('a')].some(a => a.textContent.includes('$499,000')), 'no-JS price is not linked');
  check(fallback.querySelector('#details').getBoundingClientRect().height > 0, 'no-JS details remain visible');
  check(fallback.querySelectorAll('#details dt').length === 12, 'static source retains all twelve facts');
  for (const [mode, setup] of [
    ['unsupported dialog', 'HTMLDialogElement.prototype.showModal = undefined'],
    ['failed listing initialization', 'window.ResizeObserver = undefined']
  ]) {
    frame.removeAttribute('sandbox');
    await new Promise(resolve => {
      frame.onload = resolve;
      frame.srcdoc = source.replace('<head>', `<head><base href="${new URL('../', location.href)}"><script>${setup}<\/script>`);
    });
    const fallback = frame.contentDocument;
    check(fallback.querySelector('#details').getBoundingClientRect().height > 0, `${mode}: inline details remain visible`);
    check(!fallback.querySelector('.price a').hasAttribute('aria-haspopup'), `${mode}: ordinary anchor retained`);
  }
} catch (error) { check(false, error.message); }
document.querySelector('#results').textContent = results.join('\n');
document.title = results.some(row => row.startsWith('FAIL')) ? 'FAIL: property details' : 'PASS: property details';
</script>

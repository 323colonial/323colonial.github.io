<!doctype html>
<meta charset="utf-8">
<title>Narrative scroll regression</title>
<h1>Narrative scroll regression</h1>
<pre id="results">Running…</pre>
<iframe title="Listing under test" style="width:1440px;height:1000px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
await new Promise(resolve => { frame.onload = resolve; frame.src = '../index.html'; });
const doc = frame.contentDocument, win = frame.contentWindow;
const results = [];
const check = (ok, name) => results.push(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
const settle = () => new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
try {
  const story = doc.querySelector('.story');
  const stage = story.querySelector('.story-stage');
  check(Boolean(stage), 'narrative stage exists');
  if (!stage) throw new Error('Missing narrative stage');
  await settle();
  const header = doc.querySelector('.masthead');
  const facts = doc.querySelector('.listing-summary');
  const top = parseFloat(win.getComputedStyle(stage).top);
  const start = story.offsetTop + parseFloat(win.getComputedStyle(story).paddingTop) - top;
  win.scrollTo(0, start + 2);
  await settle();
  check(Math.abs(header.getBoundingClientRect().top) < 1, 'address remains fixed');
  check(Math.abs(facts.getBoundingClientRect().top - header.getBoundingClientRect().bottom) < 2, 'facts dock under header');
  check(story.querySelector('.story-photos figure:not([hidden])')?.dataset.position === '3', 'first relevant photo');
  win.scrollTo(0, start + story.offsetHeight - stage.offsetHeight - 2);
  await settle();
  check(story.querySelector('.story-photos figure:not([hidden])')?.dataset.position === '54', 'vertical scroll advances photo');
  win.scrollTo(0, start + 2);
  await settle();
  check(story.querySelector('.story-photos figure:not([hidden])')?.dataset.position === '3', 'reverse scroll restores photo');
  const second = doc.querySelectorAll('.story')[1];
  check(story.querySelector('.story-copy').getBoundingClientRect().left < story.querySelector('.story-photos').getBoundingClientRect().left && second.querySelector('.story-copy').getBoundingClientRect().left > second.querySelector('.story-photos').getBoundingClientRect().left, 'paragraph sides alternate');
  const plan = doc.querySelector('[data-photo="31"]');
  plan.click();
  const viewer = doc.querySelector('#photo-viewer');
  check(viewer.open && doc.querySelector('#viewer-caption').textContent.includes('not existing finished space'), 'contextual plan opens with disclosure');
  viewer.close();
  await settle();
  check(doc.activeElement === plan, 'popup restores contextual opener focus');
  doc.querySelector('[data-all-photos]').click();
  check(doc.querySelector('#all-photos').open && doc.querySelectorAll('#all-photos [data-gallery-image]').length === 73, 'all 73 photos in popup');
  doc.querySelector('#all-photos [data-gallery-image]').click();
  check(viewer.open, 'catalog opens enlarged viewer');
  viewer.close();
  doc.querySelector('#all-photos').close();
  doc.querySelector('.site-footer').scrollIntoView();
  await settle();
  check(doc.querySelector('#details').getBoundingClientRect().height === 0, 'enhanced narrative ends without duplicate details');

  for (const [width, height] of [[1440, 1000], [390, 844]]) {
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    doc.activeElement.blur();
    await settle();
    // Speculative next photos must not compete with the visible, pending hero.
    const hero = doc.querySelector('.hero-photo img');
    const nextPhoto = story.querySelectorAll('.story-photos img')[1];
    let heroComplete = false;
    Object.defineProperty(hero, 'complete', {configurable: true, get: () => heroComplete});
    try {
      win.scrollTo(0, 0);
      await settle();
      nextPhoto.loading = 'lazy';
      win.updatePhotos();
      check(nextPhoto.loading === 'lazy', `${width}px: pending visible hero defers speculative preload`);
      heroComplete = true;
      nextPhoto.loading = 'lazy';
      hero.dispatchEvent(new win.Event('load'));
      check(nextPhoto.loading === 'eager', `${width}px: hero load resumes nearby preload`);
      nextPhoto.loading = 'lazy';
      hero.dispatchEvent(new win.Event('error'));
      check(nextPhoto.loading === 'eager', `${width}px: hero error resumes nearby preload`);
      heroComplete = false;
      nextPhoto.loading = 'lazy';
      win.scrollTo(0, win.scrollY + hero.getBoundingClientRect().bottom + 1);
      await settle();
      check(nextPhoto.loading === 'eager', `${width}px: scrolling past pending hero resumes preload`);
    } finally {
      delete hero.complete;
      win.updatePhotos();
    }
    // Width changes notify both window resize and the header ResizeObserver.
    let rebuildWrites = 0;
    const rebuildObserver = new win.MutationObserver(records => { rebuildWrites += records.length; });
    rebuildObserver.observe(story, {attributes: true, attributeFilter: ['class']});
    try {
      frame.style.width = `${width - 20}px`;
      await settle();
      await settle();
      check(rebuildWrites === 2, `${width}px: width resize rebuilds stories once (${rebuildWrites} class writes)`);
    } finally {
      rebuildObserver.disconnect();
      frame.style.width = `${width}px`;
      await settle();
    }
    // Height changes without a window resize must still update sticky clearance.
    for (const [element, property] of [[header, '--header-height'], [facts, '--summary-height']]) {
      const originalHeight = element.getBoundingClientRect().height;
      try {
        element.style.minHeight = `${originalHeight + 30}px`;
        await settle();
        check(parseFloat(doc.documentElement.style.getPropertyValue(property)) === element.getBoundingClientRect().height
          && element.getBoundingClientRect().height >= originalHeight + 30,
          `${width}px: observer updates ${property} without viewport resize`);
      } finally {
        element.style.removeProperty('min-height');
        await settle();
      }
    }
    check(!/scroll to explore/i.test(doc.body.textContent), `${width}px: no scroll instructions`);
    for (const section of doc.querySelectorAll('.story')) {
      const label = `${width}px ${section.getAttribute('aria-label')}`;
      check(section.classList.contains('is-scrolling'), `${label}: sequence enabled`);
      const photos = [...section.querySelectorAll('.story-photos figure')];
      const sticky = section.querySelector(width > 800 ? '.story-stage' : '.story-photos');
      const inset = parseFloat(win.getComputedStyle(sticky).top);
      const padding = parseFloat(win.getComputedStyle(section).paddingTop);
      const borderHeight = parseFloat(win.getComputedStyle(section, '::before').height) || 0;
      const offset = padding + borderHeight + (width > 800 ? 0 : section.querySelector('.story-copy').getBoundingClientRect().height + 28);
      const beginning = section.offsetTop + offset - inset;
      const step = Math.max(240, height * .5);
      const seek = async position => {
        win.scrollTo(0, beginning + step * position);
        await settle();
        const current = photos.findIndex(photo => !photo.inert);
        const dots = [...section.querySelectorAll('.photo-dots > span')];
        check(dots.length === photos.length && dots.every((dot, i) => dot.classList.contains('is-current') === (i === current)),
          `${label}: dots follow scroll/focus at ${position}`);
      };
      check(section.offsetHeight <= offset + sticky.getBoundingClientRect().height + padding + photos.length * step + 1,
        `${label}: scroll length stays one existing step per photo`);
      for (const indices of [photos.map((_, i) => i), photos.map((_, i) => i).reverse()]) {
        for (const index of indices) {
          await seek(index + .1);
          check(!photos[index].hidden && !photos[index].inert && Number(photos[index].style.getPropertyValue('--photo-opacity')) === 1,
            `${label}: complete forward/reverse coverage for photo ${photos[index].dataset.position}`);
        }
      }
      const opacity = photo => photo.hidden ? 0 : Number(win.getComputedStyle(photo.querySelector('a')).opacity);
      await seek(.625);
      const early = opacity(photos[1]);
      await seek(.875);
      const late = opacity(photos[1]);
      check(early > .1 && early < .4 && late > .6 && late < .9 && opacity(photos[0]) > 0,
        `${label}: two photos blend continuously with scroll`);
      const image = photos[1].querySelector('img');
      const imageBoxDuringBlend = image.getBoundingClientRect();
      check(win.getComputedStyle(image).objectFit === 'contain'
        && Math.abs(imageBoxDuringBlend.width / imageBoxDuringBlend.height - Number(image.getAttribute('width')) / Number(image.getAttribute('height'))) > .01,
        `${label}: contain-fit photo exposes letterbox space`);
      const photoLayers = section.querySelectorAll('.story-stage, .story-photos, .media-record, .media-record > a, .media-record img');
      check([...photoLayers].every(layer => {
        const style = win.getComputedStyle(layer);
        return style.backgroundColor === 'rgba(0, 0, 0, 0)' && style.backgroundImage === 'none';
      }), `${label}: letterboxes reveal section background without tint, including during crossfade`);
      const captionStyle = win.getComputedStyle(photos[1].querySelector('figcaption'));
      check(win.getComputedStyle(photos[0].querySelector('figcaption')).visibility === 'hidden'
        && captionStyle.visibility === 'visible' && captionStyle.opacity === '1'
        && win.getComputedStyle(photos[1]).opacity === '1',
        `${label}: one readable caption without blended text`);
      check(photos[0].inert && !photos[1].inert && photos[0].getAttribute('aria-hidden') === 'true',
        `${label}: only dominant photo is interactive and exposed`);
      await seek(.625);
      check(Math.abs(opacity(photos[1]) - early) < .01, `${label}: reverse scroll restores exact blend`);
      await seek(1);
      const counter = section.querySelector('.slide-count');
      // Stay inside the hold: rounding at exactly 1 can leave a fractional blend.
      await seek(1.05);
      const counterText = counter.firstChild;
      let photoChanges = 0;
      const observer = new win.MutationObserver(records => { photoChanges += records.length; });
      observer.observe(section.querySelector('.story-photos'), {
        subtree: true, attributes: true, attributeFilter: ['hidden', 'inert', 'aria-hidden', 'style', 'class'],
      });
      try { await seek(1.1); } finally { observer.disconnect(); }
      check(counter.firstChild === counterText, `${label}: unchanged position preserves counter text node`);
      check(photoChanges === 0, `${label}: unchanged photo state avoids DOM writes (${photoChanges})`);
      const dots = section.querySelector('.photo-dots');
      const dotBox = dots?.getBoundingClientRect();
      const imageBox = photos[1].querySelector('img').getBoundingClientRect();
      check(counter.textContent === `2 / ${photos.length}` && win.getComputedStyle(counter).clipPath === 'inset(50%)',
        `${label}: numeric position retained for screen readers only`);
      check(dotBox && dotBox.bottom <= imageBox.bottom && dotBox.top > imageBox.top
        && dotBox.left >= imageBox.left && dotBox.right <= imageBox.right
        && dots.getAttribute('aria-hidden') === 'true' && win.getComputedStyle(dots).pointerEvents === 'none',
        `${label}: decorative dots overlay image bottom without blocking link`);
      const link = photos[1].querySelector('a');
      link.focus({preventScroll: true});
      await seek(.1);
      check(doc.activeElement === link && opacity(photos[1]) === 1 && !photos[1].inert,
        `${label}: keyboard-focused photo remains fully visible`);
      link.click();
      await settle();
      check(viewer.open && !photos[1].hidden && !photos[1].inert,
        `${label}: viewer keeps scroll-displaced opener available`);
      win.dispatchEvent(new Event('resize'));
      await settle();
      check(opacity(photos[1]) === 1 && !photos[1].inert,
        `${label}: layout while viewer open preserves opener`);
      viewer.close();
      await settle();
      check(doc.activeElement === link && opacity(photos[1]) === 1,
        `${label}: viewer restores scroll-displaced photo focus`);
      link.blur();
      await settle();
      check(opacity(photos[0]) === 1, `${label}: leaving focus resumes scroll state without another scroll`);
      const nextSection = section.nextElementSibling;
      if (nextSection) {
        const gap = () => nextSection.getBoundingClientRect().top - sticky.getBoundingClientRect().bottom;
        for (const positions of [[.1, photos.length - .1], [photos.length - .1, .1]]) {
          await seek(positions[0]);
          const initialGap = gap();
          await seek(positions[1]);
          check(Math.abs(gap() - initialGap) < 2 && Math.abs(gap() - padding) < 2,
            `${label}: next section keeps exit spacing throughout forward/reverse photo hold`);
        }
        await seek(photos.length + .1);
        const stageTop = sticky.getBoundingClientRect().top;
        const nextTop = nextSection.getBoundingClientRect().top;
        await seek(photos.length + .3);
        check(Math.abs(sticky.getBoundingClientRect().top - stageTop + step * .2) < 2
          && Math.abs(nextSection.getBoundingClientRect().top - nextTop + step * .2) < 2
          && Math.abs(gap() - padding) < 2,
          `${label}: both sections travel upward together after release without overlap`);
        await seek(.1);
        const nextLink = nextSection.querySelector('.story-copy a, figure:not([inert]):not([hidden]) a');
        nextLink.focus();
        await settle();
        const focusedBox = nextLink.getBoundingClientRect();
        check(doc.activeElement === nextLink && focusedBox.top >= facts.getBoundingClientRect().bottom
          && focusedBox.bottom <= height,
          `${label}: focus entering next section is visible above the fold`);
        nextLink.blur();
      }
      await seek(photos.length - 1);
      if (section.previousElementSibling) {
        const border = win.getComputedStyle(section, '::before');
        const lineHeight = parseFloat(win.getComputedStyle(section).lineHeight);
        check(border.content !== 'none' && border.position === 'sticky'
          && Math.abs(parseFloat(border.height) - lineHeight * 1.25) < 1
          && border.backgroundColor === win.getComputedStyle(section.previousElementSibling).backgroundColor
          && Math.abs(parseFloat(border.top) - facts.getBoundingClientRect().bottom) < 2
          && sticky.getBoundingClientRect().top >= facts.getBoundingClientRect().bottom + parseFloat(border.height),
          `${label}: previous section color stays visible as a1.25-line border above content`);
        await seek(-1);
        const entry = section.querySelector(width > 800 ? '.story-stage' : '.story-copy');
        check(entry.getBoundingClientRect().top - section.getBoundingClientRect().top >= padding + parseFloat(border.height) - 1,
          `${label}: retained border does not consume entry content padding`);
        await seek(photos.length - 1);
      }
      const finalTop = sticky.getBoundingClientRect().top;
      const finalHeight = sticky.getBoundingClientRect().height;
      await seek(photos.length - .1);
      check(opacity(photos.at(-1)) === 1 && photos.slice(0, -1).every(photo => opacity(photo) === 0),
        `${label}: final photo stays fully visible through dedicated hold`);
      check(Math.abs(finalTop - inset) < 2 && Math.abs(sticky.getBoundingClientRect().top - finalTop) < 2
        && sticky.getBoundingClientRect().bottom <= height
        && Math.abs(sticky.getBoundingClientRect().height - finalHeight) < 2,
        `${label}: final photo has at least 90% of a scroll step pinned before exit`);
      await seek(photos.length + .3);
      if (section === doc.querySelector('.story:last-child')) {
        const footer = doc.querySelector('.site-footer').getBoundingClientRect();
        check(opacity(photos.at(-1)) === 1 && sticky.getBoundingClientRect().bottom <= footer.top
          && footer.bottom <= height + 1 && footer.top >= 0,
          `${label}: final photo and dated footer remain visible at page end`);
      } else {
        check(sticky.getBoundingClientRect().top < inset - step * .2, `${label}: continued scrolling exits sequence`);
      }
    }
    check(doc.documentElement.scrollWidth <= width, `${width}px: no horizontal overflow`);
  }
  frame.style.height = '480px';
  await settle();
  check(!doc.querySelector('.is-scrolling') && [...doc.querySelectorAll('.story-photos figure')].every(photo =>
    !photo.hidden && !photo.inert && !photo.hasAttribute('aria-hidden') && win.getComputedStyle(photo.querySelector('a')).opacity === '1')
    && [...doc.querySelectorAll('.story')].every(section => win.getComputedStyle(section).translate === 'none'
      && win.getComputedStyle(section, '::before').content === 'none'),
    'resize to short viewport clears blend, hidden and inert states');
  frame.style.height = '844px';
  await settle();
  check(doc.querySelectorAll('.is-scrolling').length === 7, 'resize back restores all sequences');
} catch (error) { check(false, error.message); }
document.querySelector('#results').textContent = results.join('\n');
document.title = results.some(row => row.startsWith('FAIL')) ? 'FAIL: narrative scroll' : 'PASS: narrative scroll';
</script>

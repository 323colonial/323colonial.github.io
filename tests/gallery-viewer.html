<!doctype html>
<meta charset="utf-8">
<title>Gallery viewer regression</title>
<h1>Gallery viewer regression</h1>
<p>Serve repository root, then open this page. Every result must PASS.</p>
<pre id="results">Running…</pre>
<iframe title="Gallery under test" style="width:390px;height:844px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
await new Promise(resolve => { frame.onload = resolve; frame.src = '../gallery.html'; });
const doc = frame.contentDocument;
const win = frame.contentWindow;
const results = [];
const check = (ok, name) => results.push(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
const dialog = doc.querySelector('dialog');
const links = [...doc.querySelectorAll('[data-gallery-image]')];
try {
  const open = index => {
    links[index].focus();
    links[index].click();
    check(dialog.open, `open photo ${index + 1}`);
  };
  const image = doc.querySelector('#viewer-image');
  const previousPreview = () => doc.querySelector('#previous-photo img');
  const nextPreview = () => doc.querySelector('#next-photo img');
  const previewMatches = (preview, index) => preview && !preview.hidden &&
    preview.getAttribute('src') === links[index].querySelector('img').getAttribute('src');
  open(5);
  check(previewMatches(previousPreview(), 4) && previewMatches(nextPreview(), 6), 'adjacent previews use existing small property images');
  check(previousPreview()?.alt === '' && nextPreview()?.alt === '', 'decorative previews preserve button names');
  check(doc.activeElement.textContent === 'Close', 'initial focus on Close');
  check(doc.querySelector('#viewer-caption').textContent === 'Salt-water hot tub on the open deck, surrounded by woods.', 'real hot-tub caption without placeholder disclosure');
  check(image.alt === 'Salt-water hot tub on the open deck, surrounded by woods.', 'real hot-tub accessible name');
  doc.querySelector('#next-photo').click();
  check(image.getAttribute('src') === 'assets/listing/07.webp', 'Next advances in approved order');
  check(previewMatches(previousPreview(), 5), 'real hot-tub photograph is eligible for adjacent preview');
  check(previewMatches(nextPreview(), 7), 'Next refreshes preview to following photo');
  dialog.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true}));
  check(image.getAttribute('src') === 'assets/listing/06.webp', 'ArrowLeft returns previous image');
  image.dispatchEvent(new win.Event('error'));
  check(!doc.querySelector('#viewer-error').hidden, 'load error has visible recovery');
  doc.querySelector('#next-photo').click();
  image.dispatchEvent(new win.Event('load'));
  check(doc.querySelector('#viewer-error').hidden, 'next image clears load error');
  dialog.querySelector('button').click();
  await new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
  check(!dialog.open && doc.activeElement === links[5], 'Close restores triggering link focus');
  open(0);
  doc.querySelector('#previous-photo').click();
  check(image.getAttribute('src') === 'assets/listing/33.webp', 'Previous wraps first to last');
  check(previewMatches(previousPreview(), 31) && previewMatches(nextPreview(), 0), 'previews wrap with gallery order');
  doc.querySelector('#next-photo').click();
  check(image.getAttribute('src') === 'assets/listing/01.webp', 'Next wraps last to first');
  dialog.close();
  open(30);
  check(doc.querySelector('#viewer-caption').textContent.includes('Conceptual basement plan'), 'concept disclaimer in viewer');
  check(doc.querySelector('#full-size').getAttribute('href') === 'assets/listing/31.webp', 'full-size fallback matches selection');
  doc.querySelector('#next-photo').click();
  check(previousPreview()?.hidden === true, 'concept plan is not previewed without its disclosure');
  doc.querySelector('#next-photo').click();
  check(previewMatches(previousPreview(), 31), 'property preview returns after conceptual slot');
  previousPreview()?.dispatchEvent(new win.Event('error'));
  check(previousPreview()?.hidden === true, 'failed preview disappears without blocking navigation');
  doc.querySelector('#previous-photo').click();
  check(image.getAttribute('src') === 'assets/listing/32.webp', 'navigation survives preview failure');
  dialog.close();
  const modified = new win.MouseEvent('click', {bubbles: true, cancelable: true, ctrlKey: true});
  // Cancel browser navigation after gallery handler has had its chance to ignore modified clicks.
  let intercepted;
  doc.addEventListener('click', event => { intercepted = event.defaultPrevented; event.preventDefault(); }, {once: true});
  links[0].dispatchEvent(modified);
  check(!intercepted && !dialog.open, 'modified click retains native link behavior');
} catch (error) { check(false, error.message); }
document.querySelector('#results').textContent = results.join('\n');
document.title = results.some(row => row.startsWith('FAIL')) ? 'FAIL: gallery viewer' : 'PASS: gallery viewer';
</script>

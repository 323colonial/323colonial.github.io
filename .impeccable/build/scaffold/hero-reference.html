<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: monograph-variation-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Platypi:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f6eb}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-masthead region chrome" data-region="masthead"><!-- full-width dark forest navigation bar --></div>
  <div class="r-brand region text" data-region="brand"><!-- 323 Colonial serif wordmark --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-buyer-nav region text" data-region="buyer-nav"><!-- uppercase buyer navigation links --><p style="font-size:var(--r-buyer-nav-font);line-height:1.05;margin:0">buyer-nav</p></div>
  <div class="r-header-showing region control" data-region="header-showing"><!-- warm-paper Request a showing button in masthead: rebuild the control's chrome from the crop (comp-spec.mjs --crop header-showing); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-exterior-photo region plate" data-region="exterior-photo"><img src="../../../assets/plates/exterior-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-photo-provenance region text" data-region="photo-provenance"><!-- text label disclosing verified source and retained Bright MLS watermark --><p style="font-size:var(--r-photo-provenance-font);line-height:1.05;margin:0">photo-provenance</p></div>
  <div class="r-panel-upper-ground region chrome" data-region="panel-upper-ground"><!-- continuous warm-paper upper summary field --></div>
  <div class="r-location region text" data-region="location"><!-- Berkeley Springs and West Virginia uppercase location label --><p style="font-size:var(--r-location-font);line-height:1.05;margin:0">location</p></div>
  <div class="r-title-number region text" data-region="title-number"><!-- large serif 323 title line --><p style="font-size:var(--r-title-number-font);font-family:var(--r-title-number-family),sans-serif;font-weight:var(--r-title-number-weight);line-height:1.05;margin:0">title-number</p></div>
  <div class="r-title-name region text" data-region="title-name"><!-- large serif Colonial title line --><p style="line-height:1.05;margin:0">title-name</p></div>
  <div class="r-property-deck region text" data-region="property-deck"><!-- serif A house in the woods above Berkeley Springs deck --><p style="font-size:var(--r-property-deck-font);line-height:1.05;margin:0">property-deck</p></div>
  <div class="r-feature-frame region chrome" data-region="feature-frame"><!-- hairline feature strip with three divided columns --></div>
  <div class="r-feature-facts region text" data-region="feature-facts"><!-- Cathedral glass, Fieldstone chimney, Screened porch facts --><p style="font-size:var(--r-feature-facts-font);line-height:1.05;margin:0">feature-facts</p></div>
  <div class="r-primary-showing region control" data-region="primary-showing"><!-- dark forest primary Request a showing button: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-showing); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-showing-email region text" data-region="showing-email"><!-- realtor@stevenhay.com contact address --><p style="font-size:var(--r-showing-email-font);line-height:1.05;margin:0">showing-email</p></div>
  <div class="r-planning-link region text" data-region="planning-link"><!-- secondary underlined Planning records link --><p style="font-size:var(--r-planning-link-font);line-height:1.05;margin:0">planning-link</p></div>
  <div class="r-evidence-rule region chrome" data-region="evidence-rule"><!-- warm-paper divider zone with hairline separator above evidence records --></div>
  <figure class="r-room-photo region plate" data-region="room-photo"><img src="../../../assets/plates/room-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-room-caption region text" data-region="room-caption"><!-- Real property evidence, Great room caption --><p style="font-size:var(--r-room-caption-font);line-height:1.05;margin:0">room-caption</p></div>
  <figure class="r-plan-image region plate" data-region="plan-image"><img src="../../../assets/plates/plan-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-plan-caption region text" data-region="plan-caption"><!-- Reference plan, not field-measured caption --><p style="font-size:var(--r-plan-caption-font);line-height:1.05;margin:0">plan-caption</p></div>
</main>
</body>
</html>

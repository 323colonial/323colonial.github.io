<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>323 Colonial · Four seasons study</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #252d29; background: #f0ece2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    ::selection { color: #f0ece2; background: #593a32; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 32px; color: #f0ece2; background: #5e6259; }
    h1 { margin: 0 0 4px; font: 400 30px Georgia, serif; letter-spacing: -.025em; }
    header p { margin: 0; font-size: 13px; }
    header > p { text-align: right; }
    main { max-width: 1280px; margin: auto; }
    figure { margin: 0; }
    .scene { position: relative; isolation: isolate; aspect-ratio: 1280 / 848; }
    .scene img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; mix-blend-mode: plus-lighter; }
    .scene img:not(:first-child) { opacity: 0; }
    #controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 24px 0; }
    #controls[hidden] { display: none; }
    .seasons { display: flex; flex-wrap: wrap; gap: 4px; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid transparent; background: transparent; color: #593a32; font: inherit; font-size: 14px; cursor: pointer; }
    button:hover { text-decoration: underline; text-underline-offset: 5px; }
    button[aria-pressed="true"] { border-bottom-color: #593a32; font-weight: 700; }
    #play { border-color: #593a32; min-width: 100px; }
    button:disabled { color: #50564f; border-color: #969187; cursor: default; text-decoration: none; }
    :focus-visible { outline: 3px solid #593a32; outline-offset: 3px; }
    figcaption { padding: 14px 24px 24px; font-size: 13px; line-height: 1.65; color: #50564f; }
    figcaption p { margin: 0; }
    #status { margin-bottom: 5px; color: #252d29; }
    details { margin: 0 24px 24px; }
    summary { min-height: 44px; padding-block: 12px; cursor: pointer; color: #593a32; }
    .targets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .targets img { display: block; width: 100%; height: auto; }
    .targets figcaption { padding: 8px 0; }
    @media (max-width: 600px) { .targets { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      header { padding: 18px 20px; align-items: flex-start; gap: 16px; }
      h1 { font-size: 25px; }
      header > p { max-width: 90px; line-height: 1.5; }
      #controls { padding-inline: 12px; gap: 8px; }
      button { padding-inline: 12px; }
      figcaption { padding-inline: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>323 Colonial Dr</h1><p>Berkeley Springs, WV 25411</p></div>
    <p>Four seasons<br>Private hero study</p>
  </header>
  <main>
    <figure>
      <div class="scene" role="img" aria-label="Original late-summer photograph of 323 Colonial Drive, viewed from the front-left corner.">
        <img src="v2/summer.jpg" width="1280" height="848" alt="" fetchpriority="high">
        <img src="v2/fall.webp" width="1280" height="848" alt="">
        <img src="v2/winter.webp" width="1280" height="848" alt="">
        <img src="v2/spring.webp" width="1280" height="848" alt="">
      </div>
      <div id="controls" hidden>
        <div class="seasons" role="group" aria-label="Choose a still season">
          <button type="button" data-season="3" aria-pressed="false">Spring</button>
          <button type="button" data-season="0" aria-pressed="false">Late summer</button>
          <button type="button" data-season="1" aria-pressed="false">Fall</button>
          <button type="button" data-season="2" aria-pressed="false">Winter</button>
        </div>
        <button type="button" id="play">Pause</button>
      </div>
      <figcaption>
        <p id="status">Original late-summer photograph. Loading seasonal study…</p>
        <p>Seasonal visualizations: spring, fall and winter are AI-edited concepts; late summer is the original photo. Fall and winter use actual property photos as seasonal references. Live site unchanged.</p>
      </figcaption>
    </figure>
    <details>
      <summary>Compare four seasonal targets</summary>
      <div class="targets">
        <figure><img src="v2/spring.webp" width="1280" height="848" alt="Spring concept: lush grass in golden morning light."><figcaption>Spring · golden morning</figcaption></figure>
        <figure><img src="v2/summer.jpg" width="1280" height="848" alt="Unchanged high-quality late-summer photograph."><figcaption>Late summer · unchanged original</figcaption></figure>
        <figure><img src="v2/fall.webp" width="1280" height="848" alt="Fall concept: red foliage, moss and fallen leaves, evening sky and subtle window warmth."><figcaption>Fall · golden evening, quieter windows</figcaption></figure>
        <figure><img src="v2/winter.webp" width="1280" height="848" alt="Winter concept: snow at dusk with warm golden windows."><figcaption>Winter · blue-hour warmth</figcaption></figure>
      </div>
      <p>Camera alignment corrected to the high-quality original. Fine AI-generated details can still differ. Four targets for review; the 24-frame sequence is not built yet.</p>
    </details>
  </main>
  <script type="module">
    const scene = document.querySelector('.scene');
    const controls = document.querySelector('#controls');
    const toggle = document.querySelector('#play');
    const status = document.querySelector('#status');
    const buttons = [...document.querySelectorAll('[data-season]')];
    const images = [...scene.querySelectorAll('img')];
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const cycle = 5000;
    const step = cycle / images.length;
    try {
      await Promise.all(images.map(image => image.decode()));
      const animations = images.map((image, index) => image.animate([
        { opacity: 1, offset: 0 },
        { opacity: 1, offset: 1 / 6 },
        { opacity: 0, offset: 1 / 4 },
        { opacity: 0, offset: 11 / 12 },
        { opacity: 1, offset: 1 }
      ], { duration: cycle, iterations: Infinity, delay: -((4 - index) % 4) * step }));
      animations.forEach(animation => { animation.pause(); animation.currentTime = 0; });
      let playing = !reduced.matches;
      let inView = true;
      let selected = 0;
      const names = ['Late summer', 'Fall', 'Winter', 'Spring'];
      function sync() {
        const running = playing && inView && !document.hidden && !reduced.matches;
        animations.forEach(animation => running ? animation.play() : animation.pause());
        toggle.disabled = reduced.matches;
        toggle.textContent = reduced.matches ? 'Motion off' : playing ? 'Pause' : 'Play';
        buttons.forEach(button => button.setAttribute('aria-pressed', String(!playing && Number(button.dataset.season) === selected)));
        status.textContent = playing
          ? '5s full year · Choose a season to hold that view.'
          : `${names[selected]} still · ${reduced.matches ? 'Reduced motion respected.' : 'Play to cycle through the year.'}`;
        scene.setAttribute('aria-label', playing
          ? 'Seasonal crossfade of the same front-left view of 323 Colonial Drive. Spring, fall and winter are AI concepts; late summer is the original photograph.'
          : `${names[selected]} ${selected === 0 ? 'original photograph' : 'AI seasonal visualization'} of 323 Colonial Drive, viewed from the front-left corner.`);
      }
      toggle.addEventListener('click', () => {
        playing = !playing;
        if (!playing) selected = Math.floor(((animations[0].currentTime ?? 0) % cycle) / step);
        sync();
      });
      buttons.forEach(button => button.addEventListener('click', () => {
        playing = false;
        selected = Number(button.dataset.season);
        animations.forEach(animation => { animation.pause(); animation.currentTime = selected * step; });
        sync();
      }));
      reduced.addEventListener('change', () => {
        if (reduced.matches) {
          playing = false;
          selected = 0;
          animations.forEach(animation => { animation.pause(); animation.currentTime = 0; });
        }
        sync();
      });
      document.addEventListener('visibilitychange', sync);
      new IntersectionObserver(([entry]) => { inView = entry.isIntersecting; sync(); }).observe(scene);
      controls.hidden = false;
      sync();
    } catch {
      status.textContent = 'Seasonal preview could not load. Showing the original photograph; reload to try again.';
    }
  </script>
</body>
</html>
